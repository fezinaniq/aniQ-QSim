[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aniq-qsim"
version = "2.0.0"
description = "A from-scratch quantum circuit simulator in pure Python, with an optional Minecraft frontend"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
qengine = "qengine.cli:main"

[tool.setuptools.packages.find]
include = ["qengine*", "mc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
